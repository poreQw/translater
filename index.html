 <!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>말톡 · 실시간 번역</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #251c3b;
      background: #f7f1ff;
      font-synthesis: none;
      --accent: #7551e8;
      --accent-deep: #5834cf;
      --pink: #f25d9c;
      --ink-muted: #746b88;
      --line: #ebe4f6;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse at 8% 5%, #ffd8ec 0, transparent 34%),
        radial-gradient(ellipse at 95% 88%, #d9d4ff 0, transparent 38%),
        radial-gradient(ellipse at 80% 5%, #fff0c8 0, transparent 24%),
        #f7f1ff;
    }

    main {
      width: min(100%, 880px);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid rgb(255 255 255 / 88%);
      border-radius: 32px;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 28px 80px rgb(78 48 140 / 14%);
    }

    main.is-text-display {
      width: 100%;
      max-width: none;
      min-width: 0;
      min-height: calc(100vh - 24px);
      padding: clamp(16px, 3vw, 32px);
      border-radius: 20px;
    }

    body:has(main.is-text-display) {
      display: block;
      padding: 12px;
    }

    main.is-text-display > .result {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      overflow-x: visible;
    }

    main.is-text-display .result-block + .result-block {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    main.is-text-display .recognized-text,
    main.is-text-display .translated-text {
      min-height: max(280px, calc(100vh - 220px));
      font-size: clamp(2rem, 3vw, 3.2rem) !important;
      line-height: 1.5;
    }

    .panel-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .background-color-control {
      display: none;
      width: 34px;
      height: 30px;
      align-items: center;
      justify-content: center;
      margin: 0;
      cursor: pointer;
    }

    .background-color-control input {
      width: 30px;
      height: 26px;
      padding: 2px;
      border: 1px solid #e4daf8;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    main.is-text-display .background-color-control {
      display: flex;
    }

    .theme-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 0 16px;
    }

    .theme-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px 5px 6px;
      border: 1px solid #e4daf8;
      border-radius: 999px;
      background: #fff;
      color: #625773;
      font: inherit;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .theme-track {
      position: relative;
      display: block;
      width: 46px;
      height: 24px;
      border-radius: 999px;
      background: #ffe6bd;
      transition: background .18s ease;
    }

    .theme-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgb(60 30 100 / 22%);
      font-size: 12px;
      transition: transform .18s ease;
    }

    .theme-switch[aria-checked="true"] .theme-track { background: #3d3659; }
    .theme-switch[aria-checked="true"] .theme-knob { transform: translateX(22px); }

    body[data-theme="night"] {
      color-scheme: dark;
      color: #f0eaff;
      background:
        radial-gradient(ellipse at 8% 5%, #342642 0, transparent 34%),
        radial-gradient(ellipse at 95% 88%, #252d49 0, transparent 38%),
        radial-gradient(ellipse at 80% 5%, #3a3047 0, transparent 24%),
        #171522;
    }

    body[data-theme="night"] main {
      border-color: #39324d;
      background: rgb(35 31 49 / 96%);
      box-shadow: 0 28px 80px rgb(0 0 0 / 32%);
    }

    body[data-theme="night"] select,
    body[data-theme="night"] .recognized-text,
    body[data-theme="night"] .translated-text,
    body[data-theme="night"] .copy-button,
    body[data-theme="night"] .theme-switch {
      border-color: #484158;
      background: #292537;
      color: #eee8fa;
    }

    body[data-theme="night"] .language-pair label,
    body[data-theme="night"] .result-heading h2 {
      color: #e1d8f4;
    }

    body[data-theme="night"] .language-pair select:disabled {
      background: #322e3e;
      color: #aaa2b8;
    }

    body[data-theme="night"] .result {
      border-color: #39334a;
      background: linear-gradient(145deg, #242132, #2a2333);
    }

    body[data-theme="night"] .recognized-text,
    body[data-theme="night"] .translated-text {
      box-shadow: inset 0 2px 8px rgb(0 0 0 / 16%);
    }

    body[data-theme="night"] .recognized-text,
    body[data-theme="night"] .translated-text,
    body[data-theme="night"] .translated-text.is-placeholder,
    body[data-theme="night"] .recognized-text.is-placeholder {
      color: #e8e0f4;
    }

    body[data-theme="night"] .status,
    body[data-theme="night"] .speech-tip,
    body[data-theme="night"] .translation-status,
    body[data-theme="night"] .notice {
      color: #b5acc5;
    }

    body[data-theme="night"] .status[data-kind="error"],
    body[data-theme="night"] .translation-status[data-kind="error"] {
      color: #ff91a7;
    }

    body[data-theme="night"] .status[data-kind="success"] {
      color: #87dbb5;
    }

    body[data-theme="night"] .theme-knob {
      background: #4a4166;
    }

    main.is-text-display > .eyebrow,
    main.is-text-display > h1,
    main.is-text-display > .intro,
    main.is-text-display > .language-pair,
    main.is-text-display > .status,
    main.is-text-display > .speech-tip,
    main.is-text-display > .notice,
    main.is-text-display .copy-button {
      display: none;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      letter-spacing: -.055em;
    }

    .intro {
      margin: 12px 0 30px;
      color: var(--ink-muted);
      line-height: 1.65;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: .95rem;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid #dfe2ed;
      border-radius: 14px;
      background: #fff;
      color: inherit;
      font: inherit;
      outline: none;
      box-shadow: 0 4px 14px rgb(65 40 108 / 5%);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    select:hover:not(:disabled) {
      border-color: #c8b8f5;
      box-shadow: 0 6px 18px rgb(117 81 232 / 10%);
    }

    select:focus-visible, button:focus-visible {
      outline: 3px solid #c2adff;
      outline-offset: 3px;
    }

    .mic-button {
      width: 100%;
      min-height: 58px;
      margin: 20px 0 12px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(100deg, var(--accent) 0%, #9b4de0 55%, var(--pink) 100%);
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 10px 22px rgb(117 81 232 / 24%);
      transition: filter .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .mic-button:hover {
      filter: saturate(1.15) brightness(1.04);
      box-shadow: 0 13px 28px rgb(117 81 232 / 30%);
      transform: translateY(-1px);
    }
    .mic-button:active { transform: scale(.99); }
    .mic-button[disabled] { cursor: wait; opacity: .72; }
    .mic-button.is-listening {
      background: linear-gradient(100deg, #e63e77, #fb7b73);
      box-shadow: 0 10px 25px rgb(230 62 119 / 26%);
    }

    .install-button {
      display: block;
      min-height: 44px;
      margin: 0 auto 8px;
      padding: 8px 18px;
      border: 1px solid #e4daf8;
      border-radius: 999px;
      background: #f7f2ff;
      color: var(--accent-deep);
      font: inherit;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .install-button[hidden] { display: none; }

    .install-help {
      margin: 0 0 14px;
      color: var(--ink-muted);
      font-size: .8rem;
      line-height: 1.5;
      text-align: center;
    }

    body[data-theme="night"] .install-button {
      border-color: #484158;
      background: #292537;
      color: #d7c7ff;
    }

    .status {
      min-height: 24px;
      margin: 0 0 22px;
      color: var(--ink-muted);
      font-size: .9rem;
      text-align: center;
    }
    .status[data-kind="error"] { color: #bb2852; }
    .status[data-kind="success"] { color: #21805f; }

    .speech-tip {
      margin: -12px 0 20px;
      color: #8b829c;
      font-size: .82rem;
      line-height: 1.5;
      text-align: center;
    }

    .language-pair {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .language-pair label {
      margin-bottom: 8px;
      color: #4a3c68;
      font-size: .88rem;
    }
    .language-pair select:disabled { background: #f4f1f8; color: #898197; }

    .language-pair .lang-select-hidden { display: none; }

    .lang-picker { position: relative; }

    .lang-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 7px 12px 7px 7px;
      border: 1px solid #dfe2ed;
      border-radius: 14px;
      background: #fff;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 14px rgb(65 40 108 / 5%);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .lang-trigger:hover:not(:disabled) {
      border-color: #c8b8f5;
      box-shadow: 0 6px 18px rgb(117 81 232 / 10%);
    }
    .lang-trigger[aria-expanded="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(117 81 232 / 14%);
    }
    .lang-trigger:disabled {
      background: #f4f1f8;
      color: #898197;
      cursor: not-allowed;
    }

    .lang-avatar {
      display: grid;
      width: 38px;
      height: 38px;
      flex: none;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgb(40 24 48 / 10%);
    }
    .country-flag { font-size: 25px; line-height: 1; }

    .lang-copy {
      display: grid;
      min-width: 0;
      gap: 1px;
    }
    .lang-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lang-country {
      overflow: hidden;
      color: var(--ink-muted);
      font-size: .76rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lang-caret {
      width: 8px;
      height: 8px;
      margin-left: auto;
      border-right: 2px solid #9a90ad;
      border-bottom: 2px solid #9a90ad;
      transform: rotate(45deg) translateY(-2px);
      transition: transform .18s ease;
    }
    .lang-trigger[aria-expanded="true"] .lang-caret {
      transform: rotate(-135deg) translateY(-2px);
    }

    .lang-menu {
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      max-height: min(64vh, 420px);
      padding: 8px;
      margin: 0;
      overflow-y: auto;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 50px rgb(60 30 100 / 20%);
    }
    .lang-menu[hidden] { display: none; }
    .lang-picker.is-up .lang-menu {
      top: auto;
      bottom: calc(100% + 8px);
    }

    .lang-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .lang-option .lang-avatar { width: 32px; height: 32px; }
    .lang-option .country-flag { font-size: 22px; }
    .lang-option .lang-name { font-weight: 650; }
    .lang-option:hover,
    .lang-option.is-active { background: #f1eaff; }
    .lang-option[aria-selected="true"] { background: #ece2ff; }
    .lang-option[aria-selected="true"] .lang-name { color: var(--accent-deep); }
    .lang-check {
      margin-left: auto;
      color: var(--accent);
      font-weight: 800;
      opacity: 0;
    }
    .lang-option[aria-selected="true"] .lang-check { opacity: 1; }

    .result-heading-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .lang-chip {
      display: grid;
      width: 32px;
      height: 32px;
      flex: none;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgb(60 30 100 / 18%);
    }
    .lang-chip .country-flag { font-size: 22px; }

    body[data-theme="night"] .lang-trigger,
    body[data-theme="night"] .lang-menu {
      border-color: #484158;
      background: #292537;
      color: #eee8fa;
    }
    body[data-theme="night"] .lang-trigger:disabled {
      background: #322e3e;
      color: #aaa2b8;
    }
    body[data-theme="night"] .lang-country { color: #b5acc5; }
    body[data-theme="night"] .lang-caret {
      border-color: #9a90ad;
    }
    body[data-theme="night"] .lang-option:hover,
    body[data-theme="night"] .lang-option.is-active { background: #3a3350; }
    body[data-theme="night"] .lang-option[aria-selected="true"] { background: #433a5f; }
    body[data-theme="night"] .lang-option[aria-selected="true"] .lang-name { color: #e4d7ff; }
    body[data-theme="night"] .lang-check { color: #b9a2ff; }

    .result {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, #fcfaff, #fff8fc);
    }

    .result-block + .result-block {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .result-heading h2 {
      margin: 0;
      font-size: .92rem;
      font-weight: 750;
    }

    .recognized-text,
    .translated-text {
      min-height: 280px;
      padding: 18px;
      border: 1px solid #ece6f5;
      border-radius: 16px;
      background: #fff;
      margin: 0;
      color: #504662;
      font-size: 1.2rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      transition: font-size .18s ease;
      box-shadow: inset 0 2px 8px rgb(66 43 100 / 3%);
    }
    .recognized-text.is-placeholder { color: #a198b1; }

    @media (max-width: 520px) {
      .recognized-text,
      .translated-text { min-height: 220px; }
    }

    .copy-button {
      padding: 7px 11px;
      border: 1px solid #e4daf8;
      border-radius: 999px;
      background: #fff;
      color: var(--accent-deep);
      font: inherit;
      font-size: .82rem;
      font-weight: 650;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .copy-button:hover:not(:disabled) {
      background: #f1eaff;
      transform: translateY(-1px);
    }
    .copy-button:disabled { color: #aaa3b5; cursor: not-allowed; }

    .translated-text { color: #332448; }
    .translated-text.is-placeholder { color: #a198b1; }

    .translation-status {
      min-height: 1.4em;
      margin: 8px 0 0;
      color: var(--ink-muted);
      font-size: .82rem;
    }
    .translation-status[data-kind="error"] { color: #bb2852; }

    .notice {
      margin: 18px 0 0;
      color: #8b829c;
      font-size: .8rem;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }

    @media (max-width: 900px) {
      .language-pair { grid-template-columns: 1fr; gap: 12px; }
    }

    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #eef2f8;
      line-height: 1.6;
      --accent: #3978f6;
      --accent-deep: #245fd1;
      --pink: #5b8df7;
      --ink-muted: #758096;
      --line: #e7ebf2;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(16px, 4vw, 48px) 16px;
      background:
        radial-gradient(ellipse at 12% 0%, #e1eaff 0, transparent 38%),
        radial-gradient(ellipse at 95% 100%, #e6ecf6 0, transparent 42%),
        #eef2f8;
    }

    main {
      display: flex;
      flex-direction: column;
      width: min(100%, 1120px);
      padding: clamp(20px, 4vw, 48px);
      border: 1px solid rgb(255 255 255 / 85%);
      border-radius: 24px;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 2px 8px rgb(31 45 70 / 3%), 0 24px 70px rgb(31 45 70 / 10%);
      backdrop-filter: blur(20px);
    }

    main > * { min-width: 0; }
    h1 { color: #172033; font-weight: 750; letter-spacing: -.045em; }
    .eyebrow { color: var(--accent-deep); }
    .intro, .notice { color: var(--ink-muted); }

    .source-input-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0 0 22px;
      padding: clamp(16px, 3vw, 24px);
      border: 1px solid #e9edf4;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 4px 18px rgb(31 45 70 / 5%);
    }

    .source-input-top,
    .source-input-actions,
    .result-language-control {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .source-input-top { justify-content: space-between; }
    .source-language-control { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .source-input-card label,
    .result-language-control label {
      margin: 0 0 10px;
      color: #566176;
      font-size: .82rem;
      font-weight: 650;
    }

    .source-language-control label,
    .result-language-control label { flex: 0 0 auto; margin: 0; }
    .source-language-control .lang-picker { width: min(250px, 58vw); }
    .language-pair .lang-select-hidden,
    .result-language-control .lang-select-hidden { display: none; }

    .source-text-input {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      padding: 16px 18px;
      border: 0;
      border-radius: 14px;
      outline: none;
      background: #f5f7fa;
      color: #202b3d;
      font: inherit;
      font-size: 1.08rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
      transition: box-shadow .2s ease, background .2s ease;
    }

    .source-text-input:focus {
      background: #fff;
      box-shadow: 0 0 0 3px rgb(57 120 246 / 15%), inset 0 0 0 1px #b7cdfa;
    }

    .lang-picker { position: relative; min-width: 0; }

    .lang-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      min-height: 52px;
      padding: 7px 14px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #1d2738;
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 8px rgb(31 45 70 / 5%), inset 0 0 0 1px #e9edf4;
      transition: background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .lang-trigger:hover:not(:disabled),
    .lang-trigger[aria-expanded="true"] {
      background: #fff;
      box-shadow: 0 0 0 3px rgb(57 120 246 / 12%), 0 5px 14px rgb(31 45 70 / 7%);
    }

    .lang-trigger:disabled { opacity: .58; cursor: not-allowed; }

    .lang-avatar {
      display: grid;
      width: 30px;
      height: 30px;
      flex: none;
      place-items: center;
      border-radius: 50%;
      background: #edf3ff;
      color: var(--accent-deep);
      box-shadow: none;
    }

    .lang-code { font-size: .82rem; font-weight: 750; }

    main.is-text-display > .source-input-card {

    .copy-button,
    .install-button,
    .theme-switch {
      min-height: 40px;
      border: 1px solid #e7ebf2;
      border-radius: 12px;
      background: #f7f9fc;
      color: var(--accent-deep);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .copy-button:hover:not(:disabled),
    .install-button:hover,
    .theme-switch:hover {

    }

    .status { line-height: 1.55; }
    .speech-tip { margin-top: 0; line-height: 1.6; }

    body[data-theme="night"] {
      color-scheme: dark;
      color: #eef2f8;
      background: radial-gradient(ellipse at 10% 0%, #263349 0, transparent 40%), #151a24;
    }

    body[data-theme="night"] main { border-color: #313b4b; background: rgb(29 36 48 / 96%); }
    body[data-theme="night"] .source-input-card { border-color: #354052; background: #222b39; }
    body[data-theme="night"] .result-block,
    body[data-theme="night"] .result-block + .result-block { border-color: #354052; background: #222b39; }
    body[data-theme="night"] .result-toolbar h2 { color: #e4eaf3; }
    body[data-theme="night"] .add-target-button,
    body[data-theme="night"] .remove-target-button { border-color: #39465a; background: #202938; color: #bcd1ff; }
    body[data-theme="night"] .lang-trigger { background: #19212d; color: #eef2f8; box-shadow: inset 0 0 0 1px #39465a; }
    body[data-theme="night"] .lang-menu { border-color: #39465a; background: #202938; }
    body[data-theme="night"] .lang-option:hover,
    body[data-theme="night"] .lang-option.is-active,
    body[data-theme="night"] .lang-option[aria-selected="true"] { background: #2c3b55; }
    body[data-theme="night"] .recognized-text,
    body[data-theme="night"] .translated-text,
    body[data-theme="night"] .source-text-input { background: #19212d; color: #eef2f8; }
    body[data-theme="night"] .result-heading h2,
    body[data-theme="night"] .source-input-card label,
    body[data-theme="night"] .result-language-control label { color: #e4eaf3; }
    body[data-theme="night"] .source-text-input:focus { background: #1c2736; }
    body[data-theme="night"] .translate-button { background: #e8eef8; color: #172033; }
    body[data-theme="night"] .copy-button,
    body[data-theme="night"] .install-button,
    body[data-theme="night"] .theme-switch { border-color: #39465a; background: #202938; color: #bcd1ff; }

    @media (max-width: 760px) {
      body { padding: 12px; }
      main:not(.is-text-display) {
        width: 100%;
        padding: 22px 16px;
        border-radius: 20px;
      }

      .source-input-card,
      .result-block,
      .result-block + .result-block { padding: 15px; }
      .result { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .translated-text { min-height: 150px; }
      .source-input-top,
      .source-language-control { align-items: flex-start; flex-direction: column; }
      .source-language-control .lang-picker { width: 100%; }
      .mic-device-control { grid-template-columns: minmax(0, 1fr); gap: 6px; }
      .source-input-actions { display: grid; grid-template-columns: minmax(0, 1fr); }
      .source-input-actions .mic-button,
      .source-input-actions .translate-button { width: 100%; min-width: 0; min-height: 58px; }
      .result-heading { min-height: 0; }

      main.is-text-display > .result {
        grid-template-columns: minmax(0, 1fr);
        overflow: visible;
      }

      main.is-text-display .translated-text {
        min-height: 38vh;
        overflow-wrap: anywhere;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

  </style>

<body>
  <main id="app">
    <p class="eyebrow">✨ SAY IT · SHARE IT</p>
    <h1>말톡</h1>
    <p class="intro">输入或说出内容，一次查看多种语言的翻译结果。</p>

    <section class="source-input-card" aria-label="原文输入">
      <div class="source-input-top">
        <div class="source-language-control">
          <label for="source-language">输入语言</label>
          <select id="source-language">
            <option value="ko" data-speech="ko-KR" selected>🇰🇷 한국어</option>
            <option value="en" data-speech="en-US">🇺🇸 영어 · 미국</option>
            <option value="ja" data-speech="ja-JP">🇯🇵 일본어 · 일본</option>
            <option value="zh-CN" data-speech="zh-CN">🇨🇳 중국어(간체) · 중국</option>
            <option value="es" data-speech="es-ES">🇪🇸 스페인어 · 스페인</option>
            <option value="fr" data-speech="fr-FR">🇫🇷 프랑스어 · 프랑스</option>
            <option value="de" data-speech="de-DE">🇩🇪 독일어 · 독일</option>
            <option value="it" data-speech="it-IT">🇮🇹 이탈리아어 · 이탈리아</option>
            <option value="pt" data-speech="pt-BR">🇧🇷 포르투갈어 · 브라질</option>

            <option value="vi" data-speech="vi-VN">🇻🇳 베트남어 · 베트남</option>
            <option value="th" data-speech="th-TH">🇹🇭 태국어 · 태국</option>
            <option value="id" data-speech="id-ID">🇮🇩 인도네시아어 · 인도네시아</option>
            <option value="ar" data-speech="ar-SA">🇸🇦 아랍어 · 사우디아라비아</option>
            <option value="hi" data-speech="hi-IN">🇮🇳 힌디어 · 인도</option>
            <option value="tr" data-speech="tr-TR">🇹🇷 튀르키예어 · 튀르키예</option>

        </div>
      </div>
      <div class="mic-device-control">
        <label for="mic-device-select">选择麦克风设备</label>

        <button class="refresh-microphones-button" id="refresh-microphones-button" type="button">查找设备</button>

      </div>
      <textarea class="source-text-input" id="source-text-input" maxlength="3000"
        placeholder="在这里输入要翻译的内容，或使用语音输入…" aria-label="输入要翻译的文本"></textarea>
      <div class="source-input-actions">
        <button class="mic-button" id="mic-button" type="button">🎙️ 语音输入</button>
        <button class="translate-button" id="translate-text-button" type="button">翻译全部语言</button>
      </div>
    </section>

    <div class="theme-switcher">
      <button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="밤 화면">
        <span class="theme-track" aria-hidden="true"><span class="theme-knob">🌅</span></span>
        <span class="theme-name">아침</span>
      </button>
    </div>
    <button class="install-button" id="install-button" type="button" hidden>📲 휴대폰에 설치</button>
    <p class="install-help" id="install-help" hidden>휴대폰 설치: Android는 브라우저 메뉴에서 ‘앱 설치’를, iPhone은 Safari 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p>
    <p class="status" id="status" role="status" aria-live="polite">输入文本或语音后，结果会显示在下方语言卡片中。</p>
    <p class="speech-tip">可输入文本后点击翻译，也可选择输入语言并使用语音输入。</p>

  <section id="presentation-display" hidden aria-live="polite">
    <p class="presentation-language" id="presentation-language"></p>
    <p class="presentation-translation is-placeholder" id="presentation-translation">等待翻译内容…</p>
  </section>

  <script type="module">
    const Capacitor = window.Capacitor;
    const useNativeSpeech = Capacitor?.getPlatform() === "android";
    let NativeSpeechRecognition;
    if (useNativeSpeech) {
      ({ SpeechRecognition: NativeSpeechRecognition } = await import("@capacitor-community/speech-recognition"));
    }

    const sourceLanguageSelect = document.querySelector("#source-language");
    const sourceTextInput = document.querySelector("#source-text-input");
    const microphoneSelect = document.querySelector("#mic-device-select");
    const microphoneHelp = document.querySelector("#mic-device-help");
    const refreshMicrophonesButton = document.querySelector("#refresh-microphones-button");
    const targetLanguageSelects = [];
    const app = document.querySelector("#app");
    const presentationView = document.querySelector("#presentation-display");
    const presentationLanguage = document.querySelector("#presentation-language");
    const presentationTranslation = document.querySelector("#presentation-translation");
    const presentationTargetId = new URLSearchParams(window.location.search).get("display");
    const presentationStoragePrefix = "sayit-presentation:";
    const presentationChannel = "sayit-presentation";
    let presentationBus = null;
    try {
      if ("BroadcastChannel" in window) presentationBus = new BroadcastChannel(presentationChannel);
    } catch (error) {
      console.warn("BroadcastChannel is unavailable; using local storage for presentation sync.", error);
    }
    const resultsContainer = document.querySelector("#translation-results");
    const addTargetButton = document.querySelector("#add-target-button");
    const targetCount = document.querySelector("#target-count");
    const themeSwitch = document.querySelector("#theme-switch");
    const micButton = document.querySelector("#mic-button");
    const textTranslateButton = document.querySelector("#translate-text-button");
    const statusText = document.querySelector("#status");
    const recognizedText = sourceTextInput;
    const translationOutputs = [];
    const BrowserSpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let activeMicrophoneStream;

    const MIN_RESTART_DELAY = 150;
    const MAX_RESTART_DELAY = 1200;
    const NETWORK_RETRY_DELAY = 600;
    const MAX_NETWORK_RETRY_DELAY = 1600;
    const LIVE_TRANSLATION_INTERVAL = 1400;
    const TRANSLATION_CACHE_LIMIT = 400;
    const RATE_LIMIT_COOLDOWN = 60 * 1000;
    const RATE_LIMIT_MESSAGE = "무료 번역 사용량을 모두 사용했어요. 사용량이 초기화된 뒤 다시 시도해 주세요.";

    let recognition;
    let shouldListen = false;
    let recognitionActive = false;
    let recognitionStarting = false;
    let sessionOpen = false;
    let restartTimer;
    let restartDelay = MIN_RESTART_DELAY;
    let recognitionStartedAt = 0;
    let transcriptParts = [];
    let interimTranscript = "";
    let translationTimer;
    let translationRequestId = 0;
    let pendingLiveTranscript = "";
    let lastLiveTranscript = "";
    let lastLiveTranslationAt = 0;
    let myMemoryUnavailableUntil = 0;
    let googleFallbackUnavailableUntil = 0;
    const translationCache = new Map();
    const pendingTranslationRequests = new Map();

    function setStatus(message, kind = "") {
      if (statusText.textContent !== message) statusText.textContent = message;
      if (statusText.dataset.kind !== kind) statusText.dataset.kind = kind;
    }

    function applyTheme(theme) {
      const isNight = theme === "night";
      document.body.dataset.theme = isNight ? "night" : "morning";
      document.querySelector('meta[name="theme-color"]').content = isNight ? "#171522" : "#f7f1ff";
      if (!themeSwitch) return;
      themeSwitch.setAttribute("aria-checked", String(isNight));
      themeSwitch.querySelector(".theme-name").textContent = isNight ? "밤" : "아침";
      themeSwitch.querySelector(".theme-knob").textContent = isNight ? "🌙" : "🌅";
    }

    if (themeSwitch) {
      themeSwitch.addEventListener("click", () => {
        applyTheme(document.body.dataset.theme === "night" ? "morning" : "night");
      });
      applyTheme(document.body.dataset.theme || "morning");
    }

    document.addEventListener("input", (event) => {
      if (!(event.target instanceof HTMLInputElement) || !event.target.matches("[data-color-target]")) return;
      const picker = event.target;
      const textBox = document.getElementById(picker.dataset.colorTarget);
      if (!textBox) return;
      const color = picker.value;
      const channels = color.slice(1).match(/.{2}/g).map((channel) => parseInt(channel, 16));
      const luminance = (0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2]) / 255;
      textBox.style.backgroundColor = color;
      textBox.style.color = luminance > 0.55 ? "#251c3b" : "#ffffff";
    });

    const MAX_VISIBLE_CHARACTERS = 300;

    function limitVisibleText(text, maxCharacters = MAX_VISIBLE_CHARACTERS) {
      const characters = Array.from(text);
      if (characters.length <= maxCharacters) return text;
      return characters.slice(characters.length - maxCharacters).join("").replace(/^\s+/, "");
    }

    function updateTextSize(element, text) {
      const characterCount = Array.from(text).length;
      const shrinkProgress = Math.min(Math.max((characterCount - 80) / 220, 0), 1);
      const fontSize = `${(1.2 - shrinkProgress * 0.48).toFixed(2)}rem`;
      if (element.style.fontSize !== fontSize) element.style.fontSize = fontSize;
    }

    function showTranslation(output, text, language) {
      const visibleText = limitVisibleText(text);
      output.text.textContent = visibleText;
      output.text.classList.remove("is-placeholder");
      updateTextSize(output.text, visibleText);
      output.text.lang = language;
      output.text.dir = language === "ar" ? "rtl" : "auto";
      output.copyText = text;
      output.copyButton.disabled = !text;
      output.status.textContent = "";
      output.status.dataset.kind = "";
      publishOutput(output);
    }

    function setOutputStatus(output, message, kind = "") {
      if (output.status.textContent !== message) output.status.textContent = message;
      if (output.status.dataset.kind !== kind) output.status.dataset.kind = kind;
      publishOutput(output);
    }

    function renderPresentation(payload) {
      if (!payload || payload.id !== presentationTargetId) return;
      presentationLanguage.textContent = payload.languageName;
      presentationTranslation.textContent = payload.removed ? "此语言卡片已关闭" : payload.text;
      presentationTranslation.classList.toggle(
        "is-placeholder",

      );
      presentationTranslation.lang = payload.language || "";
      presentationTranslation.dir = payload.language === "ar" ? "rtl" : "auto";

    function publishOutput(output, removed = false) {
      if (!output?.id) return;
      const payload = {
        id: output.id,
        language: output.languageSelect.value,
        languageName: getLanguageName(output.languageSelect),
        text: output.text.textContent,
        placeholder: output.text.classList.contains("is-placeholder"),
        removed
      };
      try {
        localStorage.setItem(presentationStoragePrefix + output.id, JSON.stringify(payload));
      } catch {
        if (!presentationBus) {
          setStatus("无法保存投屏内容，请允许浏览器使用本地存储。", "error");
        }
      }
      presentationBus?.postMessage(payload);

    function openPresentationWindow(output) {

      const url = new URL(window.location.href);
      url.searchParams.set("display", output.id);

    async function refreshMicrophoneDevices(requestPermission = false) {
      if (useNativeSpeech) {
        microphoneSelect.disabled = true;

        return;
      }
      if (!navigator.mediaDevices?.enumerateDevices) {
        microphoneSelect.disabled = true;
        refreshMicrophonesButton.disabled = true;
        microphoneHelp.textContent = "此浏览器不支持麦克风设备枚举，请使用新版 Chrome 或 Edge。";
        return;
      }

      if (requestPermission) {
        if (!navigator.mediaDevices.getUserMedia) {
          throw new Error("此浏览器不支持麦克风访问。");
        }
        const permissionStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        permissionStream.getTracks().forEach((track) => track.stop());
      }

      const savedDeviceId = localStorage.getItem("sayit-microphone-device");
      const selectedDeviceId = microphoneSelect.value !== "default"
        ? microphoneSelect.value
        : savedDeviceId || "default";
      const devices = await navigator.mediaDevices.enumerateDevices();
      const microphoneDevices = devices.filter((device) => device.kind === "audioinput");
      microphoneSelect.replaceChildren(new Option("系统默认麦克风", "default"));
      microphoneDevices.forEach((device, index) => {
        if (!device.deviceId || device.deviceId === "default") return;
        const label = device.label || `麦克风 ${index + 1}`;
        microphoneSelect.add(new Option(label, device.deviceId));
      });
      microphoneSelect.value = Array.from(microphoneSelect.options)
        .some((option) => option.value === selectedDeviceId)

      microphoneSelect.disabled = sessionOpen || microphoneDevices.length === 0;
      refreshMicrophonesButton.disabled = sessionOpen;
      microphoneHelp.textContent = microphoneDevices.some((device) => device.label)
        ? "选择需要使用的外接麦克风；浏览器须支持将音轨交给语音识别。"
        : "点击“查找设备”并授权麦克风后，可显示设备名称。";

    }
    window.addEventListener("pagehide", () => {

    void refreshMicrophoneDevices().catch((error) => {

    });
    refreshMicrophonesButton.addEventListener("click", async () => {

    function showRecognizedText(text) {
      const hasText = Boolean(text.trim());
      const visibleText = limitVisibleText(text);
      recognizedText.value = hasText ? visibleText : "";
      recognizedText.classList.toggle("is-placeholder", !hasText);
      updateTextSize(recognizedText, hasText ? visibleText : "");
      recognizedText.lang = sourceLanguageSelect.selectedOptions[0].dataset.speech;
      recognizedText.dir = sourceLanguageSelect.value === "ar" ? "rtl" : "auto";
    }

    const MAX_CHUNK_BYTES = 450;

    function utf8ByteLength(text) {
      let bytes = 0;
      for (const character of text) {
        const codePoint = character.codePointAt(0);
        bytes += codePoint <= 0x7f ? 1 : codePoint <= 0x7ff ? 2 : codePoint <= 0xffff ? 3 : 4;
      }
      return bytes;
    }

    function fitToByteBudget(text, maxBytes) {
      let bytes = 0;
      let length = 0;
      for (const character of text) {
        const codePoint = character.codePointAt(0);
        const size = codePoint <= 0x7f ? 1 : codePoint <= 0x7ff ? 2 : codePoint <= 0xffff ? 3 : 4;
        if (bytes + size > maxBytes) break;
        bytes += size;
        length += character.length;
      }
      return text.slice(0, length);
    }

    function splitIntoChunks(text, maxBytes = MAX_CHUNK_BYTES) {
      const chunks = [];
      let remaining = text.trim();

      while (utf8ByteLength(remaining) > maxBytes) {
        const window = fitToByteBudget(remaining, maxBytes);
        const separators = [...window.matchAll(/[\s.,!?。！？、;:]/g)];
        const splitAt = separators.length ? separators[separators.length - 1].index + 1 : window.length;
        chunks.push(remaining.slice(0, splitAt));
        remaining = remaining.slice(splitAt);
      }

      if (remaining) chunks.push(remaining);
      return chunks;
    }

    function rememberTranslation(cacheKey, translatedText) {
      if (translationCache.size >= TRANSLATION_CACHE_LIMIT) {
        translationCache.delete(translationCache.keys().next().value);
      }
      translationCache.set(cacheKey, translatedText);
    }

    async function requestTranslation(text, sourceLanguage, targetLanguage) {
      if (window.desktopAPI?.translate) {
        return window.desktopAPI.translate({ text, sourceLanguage, targetLanguage });
      }

      let myMemoryError;
      if (Date.now() >= myMemoryUnavailableUntil) {
        try {
          const params = new URLSearchParams({
            q: text,
            langpair: `${sourceLanguage}|${targetLanguage}`
          });
          const response = await fetch(`https://api.mymemory.translated.net/get?${params}`, {
            signal: AbortSignal.timeout(8000)
          });
          const result = await response.json();
          if (response.status === 429 || result.responseStatus === 429
            || /MYMEMORY WARNING/i.test(result.responseDetails ?? "")) {
            const retryAfter = Number(response.headers.get("Retry-After"));
            myMemoryUnavailableUntil = Date.now()
              + (retryAfter > 0 ? retryAfter * 1000 : RATE_LIMIT_COOLDOWN);
            throw new Error(RATE_LIMIT_MESSAGE);
          }
          if (!response.ok) {
            throw new Error(`MyMemory HTTP ${response.status}`);
          }
          if (result.responseStatus !== 200 || !result.responseData?.translatedText) {
            throw new Error(result.responseDetails || "MyMemory returned an empty translation.");
          }
          return result.responseData.translatedText;
        } catch (error) {
          myMemoryError = error;
        }
      } else {
        myMemoryError = new Error("MyMemory is temporarily rate-limited.");
      }

      if (Date.now() >= googleFallbackUnavailableUntil) {
        try {
          const params = new URLSearchParams({
            client: "gtx",
            sl: sourceLanguage,
            tl: targetLanguage,
            dt: "t",
            q: text
          });
          const response = await fetch(
            `https://translate.googleapis.com/translate_a/single?${params}`,
            { signal: AbortSignal.timeout(8000) }
          );
          if (!response.ok) throw new Error(`Google Translate HTTP ${response.status}`);
          const result = await response.json();
          const translatedText = Array.isArray(result?.[0])
            ? result[0].map((segment) => segment?.[0] || "").join("")
            : "";
          if (!translatedText) throw new Error("Google Translate returned an empty translation.");
          return translatedText;
        } catch (error) {
          googleFallbackUnavailableUntil = Date.now() + 30 * 1000;
          throw new Error(
            `MyMemory failed: ${myMemoryError instanceof Error ? myMemoryError.message : "unknown error"}; `
            + `browser fallback failed: ${error instanceof Error ? error.message : "unknown error"}`
          );
        }
      }

      throw new Error(
        `MyMemory failed: ${myMemoryError instanceof Error ? myMemoryError.message : "unknown error"}; `
        + "Google Translate browser fallback is temporarily unavailable."
      );
    }

    function translateChunk(text, sourceLanguage, targetLanguage) {
      const cacheKey = `${sourceLanguage}|${targetLanguage}|${text}`;
      const cached = translationCache.get(cacheKey);
      if (cached !== undefined) return Promise.resolve(cached);

      const pending = pendingTranslationRequests.get(cacheKey);
      if (pending) return pending;

      const request = requestTranslation(text, sourceLanguage, targetLanguage)
        .then((translatedText) => {
          rememberTranslation(cacheKey, translatedText);
          return translatedText;
        })
        .finally(() => pendingTranslationRequests.delete(cacheKey));
      pendingTranslationRequests.set(cacheKey, request);
      return request;
    }

    async function translate(text, sourceLanguage, targetLanguage) {
      const chunks = splitIntoChunks(text);
      const translations = [];
      for (const [index, chunk] of chunks.entries()) {
        if (index > 0) await new Promise((resolve) => window.setTimeout(resolve, 300));
        translations.push(await translateChunk(chunk.trim(), sourceLanguage, targetLanguage));
      }
      return translations.join(" ");
    }

    function setLanguageControlsDisabled(disabled) {
      sourceLanguageSelect.disabled = disabled;
      sourceTextInput.disabled = disabled;
      textTranslateButton.disabled = disabled;
      microphoneSelect.disabled = disabled || useNativeSpeech || !navigator.mediaDevices?.enumerateDevices;
      refreshMicrophonesButton.disabled = disabled || useNativeSpeech || !navigator.mediaDevices?.enumerateDevices;
      targetLanguageSelects.forEach((select) => {
        select.disabled = disabled;
      });
    }

    function updateMicLabel() {
      const languageName = getLanguageName(sourceLanguageSelect);
      micButton.textContent = `🎙️ ${languageName}语音输入`;
    }

    function resetMicButton() {

    function setTextDisplayMode(enabled) {
      app.classList.toggle("is-text-display", enabled);
    }

    function releaseMicrophoneStream() {
      activeMicrophoneStream?.getTracks().forEach((track) => track.stop());
      activeMicrophoneStream = undefined;
    }

    function finishListening() {
      if (!sessionOpen) return;
      sessionOpen = false;
      shouldListen = false;
      setTextDisplayMode(false);
      window.clearTimeout(restartTimer);
      window.clearTimeout(translationTimer);
      translationTimer = undefined;
      translationRequestId += 1;
      const transcript = [...transcriptParts, interimTranscript].filter(Boolean).join(" ").trim();
      const sourceLanguage = sourceLanguageSelect.value;
      const targetLanguages = targetLanguageSelects.map((select) => select.value);
      transcriptParts = [];
      interimTranscript = "";
      setLanguageControlsDisabled(false);
      resetMicButton();
      if (transcript) {
        showRecognizedText(transcript);
        void handleTranscript(transcript, sourceLanguage, targetLanguages);
      } else {
        showRecognizedText("");
        setStatus("인식된 말이 없어요. 마이크 버튼을 눌러 다시 말해 주세요.", "error");
      }
    }

    async function startRecognition() {
      if (!shouldListen || recognitionActive || recognitionStarting) return;
      recognitionStarting = true;
      try {
        if (microphoneSelect.value === "default") {
          recognition.start();
          return;
        }
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("此浏览器不支持选择麦克风设备。");
        }
        activeMicrophoneStream = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: microphoneSelect.value } }
        });
        const microphoneTrack = activeMicrophoneStream.getAudioTracks()[0];
        if (!microphoneTrack) throw new Error("所选麦克风没有可用的音频输入。");
        void refreshMicrophoneDevices().catch((error) => {
          microphoneHelp.textContent = error instanceof Error ? error.message : "无法刷新麦克风设备列表。";
        });
        if (!shouldListen) {
          releaseMicrophoneStream();
          recognitionStarting = false;
          return;
        }
        recognition.start(microphoneTrack);
      } catch (error) {
        releaseMicrophoneStream();
        recognitionStarting = false;
        if (shouldListen && error instanceof DOMException && error.name === "InvalidStateError") {
          restartDelay = Math.min(restartDelay * 2, MAX_RESTART_DELAY);
          setStatus("음성 인식을 다시 연결하고 있어요. 계속 말씀해 주세요.");
          restartTimer = window.setTimeout(startRecognition, restartDelay);
          return;
        }
        shouldListen = false;
        sessionOpen = false;
        setTextDisplayMode(false);
        setLanguageControlsDisabled(false);
        resetMicButton();
        const selectedMicUnsupported = microphoneSelect.value !== "default"
          && (error instanceof TypeError
            || error instanceof DOMException && error.name === "NotSupportedError");
        const message = selectedMicUnsupported
          ? "当前浏览器不支持将所选麦克风音轨接入语音识别，请使用新版 Chrome 或 Edge。"
          : error instanceof Error ? error.message : "麦克风或语音识别启动失败。";
        setStatus(message, "error");
      }
    }

    async function translateForOutput(text, sourceLanguage, targetLanguage, output, requestId) {
      setOutputStatus(output, "번역 중...");
      try {
        const translated = await translate(text, sourceLanguage, targetLanguage);
        if (requestId < output.latestAppliedRequestId) return false;
        output.latestAppliedRequestId = requestId;
        showTranslation(output, translated, targetLanguage);
        return true;
      } catch (error) {
        if (requestId < output.latestAppliedRequestId) return false;
        output.latestAppliedRequestId = requestId;
        const failureMessage = "该语言翻译失败，请重试";
        output.text.textContent = failureMessage;
        output.text.classList.remove("is-placeholder");
        updateTextSize(output.text, failureMessage);
        output.text.lang = targetLanguage;
        output.text.dir = targetLanguage === "ar" ? "rtl" : "auto";
        output.copyText = "";
        output.copyButton.disabled = true;
        setOutputStatus(
          output,
          error instanceof Error ? error.message : "번역 중 오류가 발생했습니다.",
          "error"
        );
        return false;
      }
    }

    async function translateOutputs(text, sourceLanguage, targetLanguages, requestId) {
      let previousRequest = Promise.resolve();
      const requests = translationOutputs.map((output, index) => {
        const request = previousRequest.then(async () => {
          if (index > 0) await new Promise((resolve) => window.setTimeout(resolve, 300));
          return translateForOutput(text, sourceLanguage, targetLanguages[index], output, requestId);
        });
        previousRequest = request.then(() => undefined, () => undefined);
        return request;
      });
      const results = await Promise.allSettled(requests);
      return results.map((result) => result.status === "fulfilled" && result.value);
    }

    function scheduleLiveTranslation(text) {
      const spokenText = text.trim();
      if (!spokenText || !sessionOpen) return;

      pendingLiveTranscript = spokenText;
      if (translationTimer) return;
      const delay = lastLiveTranslationAt
        ? Math.max(0, LIVE_TRANSLATION_INTERVAL - (Date.now() - lastLiveTranslationAt))
        : 350;
      translationTimer = window.setTimeout(() => {
        translationTimer = undefined;
        if (!sessionOpen || !pendingLiveTranscript || pendingLiveTranscript === lastLiveTranscript) return;

        const transcript = pendingLiveTranscript;
        lastLiveTranscript = transcript;
        lastLiveTranslationAt = Date.now();
        const requestId = ++translationRequestId;
        const sourceLanguage = sourceLanguageSelect.value;
        const targetLanguages = targetLanguageSelects.map((select) => select.value);
        void translateOutputs(transcript, sourceLanguage, targetLanguages, requestId);
      }, delay);

      const waitingMessage = "말씀을 듣고 있어요. 곧 번역됩니다.";
      translationOutputs.forEach((output) => {
        if (output.status.textContent !== waitingMessage) setOutputStatus(output, waitingMessage);
      });
    }

    async function handleTranscript(text, sourceLanguage, targetLanguages) {
      const spokenText = text.trim();
      if (!spokenText) {
        setStatus("말씀을 알아듣지 못했어요. 다시 한번 말해 주세요.", "error");
        return;
      }

      window.clearTimeout(translationTimer);
      translationTimer = undefined;
      const requestId = ++translationRequestId;
      setStatus("긴 문장을 모두 번역하고 있어요...");
      const results = await translateOutputs(spokenText, sourceLanguage, targetLanguages, requestId);
      if (requestId !== translationRequestId) return;
      setStatus(
        results.every(Boolean) ? "所有目标语言翻译已完成。" : "部分翻译失败，请查看对应语言卡片。",
        results.every(Boolean) ? "success" : "error"
      );
    }

    if (!useNativeSpeech && !BrowserSpeechRecognition) {
      micButton.disabled = true;
      setStatus("이 브라우저는 음성 인식을 지원하지 않아요. Chrome 또는 Edge에서 열어 주세요.", "error");
    } else if (!useNativeSpeech) {
      recognition = new BrowserSpeechRecognition();
      recognition.interimResults = true;
      recognition.continuous = true;
      recognition.maxAlternatives = 5;

      recognition.onstart = () => {
        recognitionStarting = false;
        recognitionActive = true;
        recognitionStartedAt = Date.now();
        if (!shouldListen) {
          recognition.stop();
          return;
        }
        micButton.classList.add("is-listening");
        micButton.textContent = "🔴 듣는 중 · 끝내려면 누르기";
        setStatus("正在收听；结束后，结果会显示在所有目标语言卡片中。");
      };

      recognition.onresult = (event) => {
        let currentInterim = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const alternatives = event.results[index];
          let bestAlternative = alternatives[0];
          for (let candidateIndex = 1; candidateIndex < alternatives.length; candidateIndex += 1) {
            const candidate = alternatives[candidateIndex];
            if (candidate.confidence > bestAlternative.confidence) {
              bestAlternative = candidate;
            }
          }
          if (event.results[index].isFinal) {
            transcriptParts.push(bestAlternative.transcript);
          } else {
            currentInterim += bestAlternative.transcript;
          }
        }
        interimTranscript = currentInterim;
        const fullTranscript = [...transcriptParts, interimTranscript].filter(Boolean).join(" ");
        showRecognizedText(fullTranscript);
        scheduleLiveTranslation(fullTranscript);
      };

      recognition.onerror = (event) => {
        const messages = {
          "not-allowed": "마이크 권한이 필요해요. 브라우저 설정에서 마이크를 허용해 주세요.",
          "audio-capture": "마이크를 찾을 수 없어요. 연결 상태를 확인해 주세요.",
          "network": "인터넷 연결이 잠시 끊겼어요. 다시 연결해 계속 들을게요.",
          "service-not-allowed": "브라우저에서 음성 인식 서비스를 사용할 수 없어요."
        };
        if (event.error === "no-speech" || event.error === "aborted") return;
        if (event.error === "network" && shouldListen) {
          restartDelay = Math.min(Math.max(restartDelay * 2, NETWORK_RETRY_DELAY), MAX_NETWORK_RETRY_DELAY);
          setStatus(messages[event.error]);
          return;
        }
        shouldListen = false;
        window.clearTimeout(restartTimer);
        setStatus(messages[event.error] || `음성 인식 오류가 발생했어요. (${event.error})`, "error");
      };

      recognition.onend = () => {
        recognitionActive = false;
        recognitionStarting = false;
        releaseMicrophoneStream();
        if (shouldListen) {
          if (Date.now() - recognitionStartedAt > 1500) {
            restartDelay = MIN_RESTART_DELAY;
          }
          if (interimTranscript) {
            transcriptParts.push(interimTranscript);
            interimTranscript = "";
          }
          showRecognizedText(transcriptParts.join(" "));
          scheduleLiveTranslation(transcriptParts.join(" "));
          setStatus("계속 듣고 있어요. 말씀을 마친 뒤 마이크 버튼을 눌러 주세요.");

        }

    async function startNativeRecognition() {
      try {
        const permission = await NativeSpeechRecognition.requestPermissions();
        if (permission.speechRecognition !== "granted") {
          throw new Error("휴대폰 설정에서 이 앱의 마이크 권한을 허용해 주세요.");
        }

        const { available } = await NativeSpeechRecognition.available();
        if (!available) {
          throw new Error("휴대폰에서 사용할 수 있는 시스템 음성 인식 서비스를 찾지 못했어요.");
        }

        const result = await NativeSpeechRecognition.start({
          language: sourceLanguageSelect.selectedOptions[0].dataset.speech,
          maxResults: 1,
          partialResults: false,
          popup: true,
          prompt: "말씀해 주세요"
        });

        transcriptParts = result.matches?.[0] ? [result.matches[0]] : [];
        shouldListen = false;
        finishListening();
      } catch (error) {
        shouldListen = false;
        sessionOpen = false;
        setTextDisplayMode(false);
        setLanguageControlsDisabled(false);
        resetMicButton();
        setStatus(
          error instanceof Error ? error.message : "시스템 음성 인식을 시작하지 못했어요.",
          "error"
        );
      }
    }

    function validateTargetLanguages() {
      const selectedTargets = targetLanguageSelects.map((select) => select.value);
      if (selectedTargets.includes(sourceLanguageSelect.value)) {
        setStatus("目标语言不能与输入语言相同。", "error");
        return null;
      }
      if (new Set(selectedTargets).size !== selectedTargets.length) {
        setStatus("请为每张卡片选择不同的目标语言。", "error");
        return null;
      }
      return selectedTargets;
    }

    textTranslateButton.addEventListener("click", () => {
      if (sessionOpen) {
        setStatus("请先结束语音输入，再开始文本翻译。", "error");
        return;
      }
      const targetLanguages = validateTargetLanguages();
      if (!targetLanguages) return;
      const text = sourceTextInput.value.trim();
      if (!text) {
        setStatus("请先输入要翻译的文本。", "error");
        sourceTextInput.focus();
        return;
      }

      void handleTranscript(text, sourceLanguageSelect.value, targetLanguages);
    });

    sourceTextInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        textTranslateButton.click();
      }
    });

    micButton.addEventListener("click", () => {
      if (!useNativeSpeech && !recognition) return;
      if (shouldListen) {
        shouldListen = false;
        micButton.disabled = true;
        micButton.textContent = "正在整理语音…";
        setStatus("正在完成语音识别…");
        window.clearTimeout(restartTimer);
        if (recognitionActive) {
          recognition.stop();
        } else {
          finishListening();
        }
        return;
      }

      if (!validateTargetLanguages()) return;

      transcriptParts = [];
      interimTranscript = "";
      window.clearTimeout(translationTimer);
      translationTimer = undefined;
      pendingLiveTranscript = "";
      lastLiveTranscript = "";
      lastLiveTranslationAt = 0;
      translationRequestId += 1;
      showRecognizedText("");
      translationOutputs.forEach((output) => {
        output.latestAppliedRequestId = translationRequestId;
        const placeholder = "翻译结果将在此显示。";
        output.text.textContent = placeholder;
        output.text.classList.add("is-placeholder");
        updateTextSize(output.text, "");
        output.copyText = "";
        output.copyButton.disabled = true;
        setOutputStatus(output, "");
      });
      if (useNativeSpeech) {
        sessionOpen = true;
        shouldListen = true;
        setTextDisplayMode(true);
        setLanguageControlsDisabled(true);
        micButton.disabled = true;
        micButton.textContent = "正在打开系统语音识别…";
        setStatus("请在系统语音识别窗口中说话，完成后关闭窗口。");
        void startNativeRecognition();
        return;
      }
      recognition.lang = sourceLanguageSelect.selectedOptions[0].dataset.speech;
      sessionOpen = true;
      shouldListen = true;
      setTextDisplayMode(true);
      setLanguageControlsDisabled(true);
      micButton.classList.add("is-listening");
      micButton.textContent = "🔴 듣는 중 · 끝내려면 누르기";
      setStatus("正在收听；结束后，结果会显示在所有目标语言卡片中。");
      startRecognition();
    });

    sourceLanguageSelect.addEventListener("change", () => {
      translationRequestId += 1;
      translationOutputs.forEach((output) => {
        output.latestAppliedRequestId = translationRequestId;
      });
      updateMicLabel();
      updateTargetControls();
    });
    updateMicLabel();
    updateOutputHeadings();

    const installButton = document.querySelector("#install-button");
    const installHelp = document.querySelector("#install-help");
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || navigator.standalone === true;
    let deferredInstallPrompt;

    if (!isStandalone && (/android|iphone|ipad|ipod/i.test(navigator.userAgent) || isIos)) {
      installButton.hidden = false;
      installHelp.hidden = false;
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
      installHelp.hidden = false;
    });

    installButton.addEventListener("click", async () => {
      if (!deferredInstallPrompt) {
        setStatus(isIos
          ? "Safari 공유 메뉴에서 ‘홈 화면에 추가’를 선택해 설치해 주세요."

        return;
      }

      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      try {
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice.outcome === "accepted") {
          setStatus("휴대폰에 앱을 설치하고 있어요.", "success");
        }
      } catch (error) {
        console.error("앱 설치 요청에 실패했습니다.", error);
        setStatus("앱 설치를 시작하지 못했어요. 브라우저 메뉴에서 다시 시도해 주세요.", "error");
      }
    });

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      installButton.hidden = true;
      installHelp.hidden = true;
      setStatus("말톡을 휴대폰에 설치했어요.", "success");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch((error) => {
        console.error("오프라인 앱 파일 등록에 실패했습니다.", error);
      });
    }

  const motif = MOTIF[d.motif] ? MOTIF[d.motif](d) : "";
  const wear = d.wear && WEAR[d.wear] ? WEAR[d.wear](d) : "";

  return `<svg viewBox="0 0 120 120" role="img" aria-label="${d.label} 캐릭터" xmlns="http://www.w3.org/2000/svg">

</svg>`;
}

    /* --------------------------------------------- 언어별 캐릭터 선택 UI */
    const LANGUAGE_NAMES = {
      ko: "韩语",
      en: "英语",
      ja: "日语",
      "zh-CN": "简体中文",
      es: "西班牙语",
      fr: "法语",
      de: "德语",
      it: "意大利语",
      pt: "葡萄牙语",
      ru: "俄语",
      vi: "越南语",
      th: "泰语",
      id: "印度尼西亚语",
      ar: "阿拉伯语",
      hi: "印地语",
      tr: "土耳其语"
    };

    const LANGUAGE_MARKS = {
      ko: "韩",
      en: "英",
      ja: "日",
      "zh-CN": "中",
      es: "西",
      fr: "法",
      de: "德",
      it: "意",
      pt: "葡",
      ru: "俄",
      vi: "越",
      th: "泰",
      id: "印",
      ar: "阿",
      hi: "印",
      tr: "土"
    };

    function avatarMarkup(key) {
      const mark = LANGUAGE_MARKS[key];
      return mark ? '<span class="lang-code" aria-hidden="true">' + mark + '</span>' : "";
    }

    function describeOption(option) {
      return {
        name: LANGUAGE_NAMES[option.value] || option.textContent.trim(),
        region: ""
      };
    }

    function setupLanguagePicker(select) {
      if (!select || select.dataset.pickerReady) return;
      select.dataset.pickerReady = "yes";

      const label = document.querySelector('label[for="' + select.id + '"]');
      const labelId = select.id + "-label";
      if (label) label.id = labelId;

      const options = Array.prototype.slice.call(select.options);
      const listId = select.id + "-list";

      const picker = document.createElement("div");
      picker.className = "lang-picker";

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "lang-trigger";
      trigger.setAttribute("role", "combobox");
      trigger.setAttribute("aria-haspopup", "listbox");
      trigger.setAttribute("aria-expanded", "false");
      trigger.setAttribute("aria-controls", listId);
      if (label) trigger.setAttribute("aria-labelledby", labelId);
      trigger.innerHTML =
        '<span class="lang-avatar" aria-hidden="true"></span>' +
        '<span class="lang-copy"><span class="lang-name"></span><span class="lang-country"></span></span>' +
        '<span class="lang-caret" aria-hidden="true"></span>';

      const list = document.createElement("ul");
      list.className = "lang-menu";
      list.id = listId;
      list.tabIndex = -1;
      list.hidden = true;
      list.setAttribute("role", "listbox");
      if (label) list.setAttribute("aria-labelledby", labelId);

      const avatarBox = trigger.querySelector(".lang-avatar");
      const nameBox = trigger.querySelector(".lang-name");
      const regionBox = trigger.querySelector(".lang-country");

      let items = [];
      let activeIndex = -1;

      function currentOption() {
        return select.selectedOptions[0]
          || options.find((option) => option.value === select.value)
          || options[0];
      }

      function renderList() {
        if (items.length) return;
        options.forEach(function (option, index) {
          const meta = describeOption(option);
          const item = document.createElement("li");
          item.className = "lang-option";
          item.id = select.id + "-option-" + index;
          item.dataset.value = option.value;
          item.setAttribute("role", "option");
          item.addEventListener("click", function () {
            choose(option.value);
          });
          const avatar = document.createElement("span");
          avatar.className = "lang-avatar";
          avatar.setAttribute("aria-hidden", "true");
          avatar.innerHTML = avatarMarkup(option.value);
          const copy = document.createElement("span");
          copy.className = "lang-copy";
          const name = document.createElement("span");
          name.className = "lang-name";
          name.textContent = meta.name;
          const region = document.createElement("span");
          region.className = "lang-country";
          region.textContent = meta.region;
          copy.appendChild(name);
          copy.appendChild(region);
          const check = document.createElement("span");
          check.className = "lang-check";
          check.setAttribute("aria-hidden", "true");
          check.textContent = "✓";
          item.appendChild(avatar);
          item.appendChild(copy);
          item.appendChild(check);
          list.appendChild(item);
          items.push(item);
        });
      }

      function setActive(index, shouldScroll) {
        if (!items.length) return;
        activeIndex = (index + items.length) % items.length;
        items.forEach(function (item, i) {
          item.classList.toggle("is-active", i === activeIndex);
        });
        const item = items[activeIndex];
        list.setAttribute("aria-activedescendant", item.id);
        if (shouldScroll) item.scrollIntoView({ block: "nearest" });
      }

      function openList() {
        if (select.disabled) return;
        renderList();
        const triggerBox = trigger.getBoundingClientRect();
        const spaceBelow = window.innerHeight - triggerBox.bottom;
        const maximumHeight = Math.min(window.innerHeight * 0.64, 420);
        picker.classList.toggle("is-up", spaceBelow < maximumHeight && triggerBox.top > spaceBelow);
        list.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        picker.classList.add("is-open");
        const selectedIndex = options.findIndex(function (option) {
          return option.value === select.value;
        });
        setActive(selectedIndex < 0 ? 0 : selectedIndex, false);
        list.focus();
      }

      function closeList(returnFocus) {
        if (list.hidden) return;
        list.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
        picker.classList.remove("is-open");
        list.removeAttribute("aria-activedescendant");
        items.forEach(function (item) {
          item.classList.remove("is-active");
        });
        if (returnFocus) trigger.focus();
      }

      function choose(value) {
        const changed = select.value !== value;
        if (changed) select.value = value;
        if (changed) {
          select.dispatchEvent(new Event("change", { bubbles: true }));
        } else {
          sync();
        }
        closeList(true);
      }

      function sync() {
        const option = currentOption();
        if (!option) {
          trigger.disabled = true;
          return;
        }
        const meta = describeOption(option);
        avatarBox.innerHTML = avatarMarkup(option.value);
        nameBox.textContent = meta.name;
        regionBox.textContent = meta.region;
        regionBox.hidden = !meta.region;
        trigger.disabled = select.disabled;
        items.forEach(function (item) {
          item.setAttribute("aria-selected", String(item.dataset.value === select.value));
        });
        const chip = document.querySelector('[data-chip-for="' + select.id + '"]');
        if (chip) chip.innerHTML = avatarMarkup(option.value);
        if (select.disabled) closeList(false);
      }

      trigger.addEventListener("click", function () {
        if (list.hidden) {
          openList();
        } else {
          closeList(false);
        }
      });

      trigger.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openList();
        }
      });

      list.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          setActive(activeIndex + 1, true);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          setActive(activeIndex - 1, true);
        } else if (event.key === "Home") {
          event.preventDefault();
          setActive(0, true);
        } else if (event.key === "End") {
          event.preventDefault();
          setActive(items.length - 1, true);
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (items[activeIndex]) choose(items[activeIndex].dataset.value);
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeList(true);
        } else if (event.key === "Tab") {
          closeList(false);
        }
      });

      document.addEventListener("pointerdown", function (event) {
        if (!picker.contains(event.target)) closeList(false);
      });
      window.addEventListener("resize", function () {
        closeList(false);
      });

      select.addEventListener("change", sync);
      new MutationObserver(sync).observe(select, { attributes: true, attributeFilter: ["disabled"] });

      select.classList.add("lang-select-hidden");
      select.setAttribute("tabindex", "-1");
      select.parentNode.insertBefore(picker, select.nextSibling);
      picker.appendChild(trigger);
      picker.appendChild(list);
      sync();
    }

    function attachLanguageChip(select, heading) {
      if (!select || !heading) return;
      const title = heading.querySelector("h2");
      if (!title) return;
      const wrap = document.createElement("div");
      wrap.className = "result-heading-main";
      const chip = document.createElement("span");
      chip.className = "lang-chip";
      chip.dataset.chipFor = select.id;
      chip.setAttribute("aria-hidden", "true");
      chip.innerHTML = avatarMarkup(select.value);
      heading.insertBefore(wrap, title);
      wrap.appendChild(chip);
      wrap.appendChild(title);
    }

    window.initializeLanguageControl = function (select, heading) {
      attachLanguageChip(select, heading);
      setupLanguagePicker(select);
    };
    setupLanguagePicker(document.querySelector("#source-language"));
  </script>
